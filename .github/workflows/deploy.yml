name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e91671a3454db408bd26fb03624f5279
          preCommands: npx wrangler pages project create sei-hp --production-branch=main || echo "project already exists"
          command: pages deploy . --project-name=sei-hp --branch=main --commit-dirty=true
